name: Close stale issues and pull requests

on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  # Needed to label and comment on stale issues
  issues: write
  # Needed to label and comment on stale pull requests
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Only items a maintainer has triaged and asked the author about are
          # ever marked stale; everything else is left alone.
          only-labels: 'awaiting more info'
          days-before-stale: 30
          days-before-close: 30
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: 'We asked for more information and have not heard back in 30 days. This issue will be closed in 30 days unless the information is provided or the stale label is removed.'
          stale-pr-message: 'We asked for more information and have not heard back in 30 days. This pull request will be closed in 30 days unless the information is provided or the stale label is removed.'
          exempt-issue-labels: 'never-stale,security-release,help wanted,good first issue,release'
          exempt-pr-labels: 'never-stale,security-release,release'
